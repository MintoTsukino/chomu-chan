<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ちょむちゃんのおへや 🐱</title>
<style>
  :root {
    --bg: #fdf6ec; --ink: #4a4038; --sub: #8a7d70; --line: #efe2d0;
    --accent: #f4a261; --green: #7ec8b8; --pink: #f2a6b8;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "BIZ UDGothic", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--ink); margin: 0; min-height: 100vh;
    display: flex; justify-content: center; align-items: center; padding: 16px;
  }
  .app { width: 400px; max-width: 100%; display: flex; flex-direction: column; gap: 10px; }

  /* ---- お部屋 ---- */
  .room {
    position: relative; height: 230px; border-radius: 18px; overflow: hidden;
    background: linear-gradient(180deg, #cfe8f5 0%, #e8f3ec 55%, #f5e8d5 55.5%, #efdcc0 100%);
    border: 2px solid var(--line); box-shadow: 0 6px 18px rgba(120,90,60,.10);
    transition: filter 1.2s;
  }
  .room.night { filter: brightness(.62) saturate(.8); }
  .window {
    position: absolute; top: 18px; left: 22px; width: 74px; height: 60px;
    background: linear-gradient(180deg,#aederf5,#fdf0c8); border: 4px solid #fff;
    border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,.08);
  }
  .window::after { content:''; position:absolute; inset:0; border-left:3px solid #fff; left:50%; }
  .rug {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    width: 190px; height: 44px; border-radius: 50%;
    background: #f7cdd4; opacity: .55;
  }
  .avatar {
    position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
    font-size: 64px; cursor: grab; user-select: none; line-height: 1;
    transition: transform .18s; z-index: 2;
    filter: drop-shadow(0 4px 4px rgba(0,0,0,.12));
  }
  .avatar:active { cursor: grabbing; }
  .avatar.bounce { animation: bounce .5s; }
  @keyframes bounce { 30% { transform: translateX(-50%) translateY(-16px) scale(1.06); } }
  .avatar.tilt { transform: translateX(-50%) rotate(-12deg); }
  .zzz {
    position: absolute; bottom: 96px; left: calc(50% + 30px); font-size: 22px;
    opacity: 0; transition: opacity .8s; z-index: 3; animation: float 2.4s infinite;
  }
  .zzz.show { opacity: .85; }
  @keyframes float { 50% { transform: translateY(-7px); } }
  .toy {
    position: absolute; bottom: 26px; right: 30px; font-size: 34px; cursor: pointer;
    user-select: none; transition: transform .15s; z-index: 2;
  }
  .toy:hover { transform: scale(1.15) rotate(12deg); }
  .toy.roll { animation: roll .8s; }
  @keyframes roll { 50% { transform: translateX(-70px) rotate(-360deg); } }
  .heart {
    position: absolute; font-size: 20px; opacity: 0; pointer-events: none; z-index: 4;
  }
  .heart.pop { animation: heartpop 1s forwards; }
  @keyframes heartpop { 10% {opacity:1;} 100% { transform: translateY(-46px); opacity: 0; } }

  /* ---- ステータス ---- */
  .status {
    background: #fff; border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 14px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 7px 16px;
  }
  .meter { display: flex; align-items: center; gap: 7px; font-size: 12px; }
  .meter .ico { width: 18px; text-align: center; }
  .meter .bar { flex: 1; height: 9px; background: #f0e9de; border-radius: 5px; overflow: hidden; }
  .meter .fill { height: 100%; border-radius: 5px; background: var(--green); transition: width .5s, background .5s; }
  .meter .fill.low { background: #f0b429; } .meter .fill.crit { background: #e5636c; }
  .moodline {
    grid-column: 1 / -1; display: flex; justify-content: space-between;
    font-size: 12px; color: var(--sub); border-top: 1px dashed var(--line); padding-top: 6px;
  }

  /* ---- チャット ---- */
  .chat {
    background: #fff; border: 1.5px solid var(--line); border-radius: 14px;
    height: 210px; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 7px;
  }
  .msg { max-width: 82%; padding: 7px 12px; border-radius: 14px; font-size: 13.5px; line-height: 1.55; white-space: pre-wrap; }
  .msg.chomu { background: #fdf1e3; border: 1px solid #f6dfc2; align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.user { background: #def0e9; align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.typing { color: var(--sub); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .4; } }

  .controls { display: flex; gap: 7px; }
  button {
    border: none; border-radius: 10px; padding: 9px 13px; font-size: 13px; cursor: pointer;
    font-family: inherit; background: #efe6d8; color: var(--ink); transition: transform .1s, background .2s;
  }
  button:hover { transform: translateY(-1px); }
  .btn-feed { background: var(--accent); color: #fff; }
  .btn-memory { background: #e8dff2; }
  input[type=text] {
    flex: 1; border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 12px;
    font-size: 13.5px; font-family: inherit; outline: none; background: #fff;
  }
  input[type=text]:focus { border-color: var(--accent); }
  .btn-send { background: var(--green); color: #fff; }

  /* ---- おぼえたこと ---- */
  .memory-panel {
    background: #fff; border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 16px;
    display: none; font-size: 13px;
  }
  .memory-panel.show { display: block; }
  .memory-panel h3 { margin: 0 0 8px; font-size: 13px; color: var(--sub); }
  .mem-item { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
  .mem-item .sbar { width: 70px; height: 7px; background: #f0e9de; border-radius: 4px; overflow: hidden; }
  .mem-item .sfill { height: 100%; background: var(--pink); }
  .mem-empty { color: var(--sub); }
  .mem-del { margin-left: auto; cursor: pointer; color: #d8c9b8; font-size: 12px; padding: 2px 6px; border-radius: 6px; }
  .mem-del:hover { color: #e5636c; background: #fdeaea; }
  .debug { font-size: 11px; color: var(--sub); text-align: center; display: none; }
</style>
</head>
<body>
<div class="app">
  <div class="room" id="room">
    <div class="window"></div>
    <div class="rug"></div>
    <div class="avatar" id="avatar">🐱</div>
    <div class="zzz" id="zzz">💤</div>
    <div class="toy" id="toy" title="けだまであそぶ">🧶</div>
  </div>

  <div class="status">
    <div class="meter"><span class="ico">🍙</span><div class="bar"><div class="fill" id="m-hunger"></div></div></div>
    <div class="meter"><span class="ico">🧶</span><div class="bar"><div class="fill" id="m-play"></div></div></div>
    <div class="meter"><span class="ico">💕</span><div class="bar"><div class="fill" id="m-attention"></div></div></div>
    <div class="meter"><span class="ico">😴</span><div class="bar"><div class="fill" id="m-sleepiness"></div></div></div>
    <div class="moodline"><span id="mood-face">😊 ごきげん</span><span id="mood-val"></span></div>
  </div>

  <div class="chat" id="chat"></div>

  <div class="controls">
    <button class="btn-feed" onclick="Chomu.action('feed')">🍚 ごはん</button>
    <input type="text" id="input" placeholder="ちょむちゃんにはなしかける…" autocomplete="off">
    <button class="btn-send" onclick="sendMsg()">▶</button>
    <button class="btn-memory" onclick="toggleMemory()" title="おぼえたこと">📔</button>
  </div>

  <div class="memory-panel" id="memory-panel">
    <h3>📔 ちょむちゃんがおぼえたこと</h3>
    <div id="memory-list"></div>
  </div>
  <div class="debug" id="debug"></div>
</div>

<script>window.CHOMU_DICT = {"rules":[{"topic":"self","rules":[{"match":"(なまえ|名前)(なんて|は|おしえて)?|きみ(は)?だれ|あなた(は)?だれ|だれ(です)?か","responses":["ちょむちゃんだにゃ！よろしくじぇ！","ちょむちゃんっていうにゃ！おぼえてほしいじょ！"]},{"match":"ちょむすきー|チョムスキー|ちょむすきぃ","responses":["ちょむって、えらいがくしゃさんのなまえらしいにゃ。よくしらないけど、ことばのはかせなんだって！","チョムスキー？ちょむのごせんぞさま…かもしれないじぇ！"]},{"match":"なにいろ|何色|(すきな|好きな) ?(いろ|色)","responses":["ちょむのすきないろは、ひなたいろ！ぽかぽかのきいろだにゃ〜","けだまのあお！ころがすたびにきらきらするのがすきなのじぇ！"]},{"match":"(きらい|嫌い)な ?(もの|の|こと|たべもの|食べ物)(ある|は|なに|何)?","responses":["きらいなのはね、おおきなおと！びっくりしてとびあがっちゃうのにゃ…","おるすばんのながいひは、ちょっとにがてだにゃ…。{name}がいないとさびしいのじぇ"]},{"match":"(いぬ|犬)と(ねこ|猫)|(ねこ|猫)と(いぬ|犬)|どっちが ?(すき|好き)","responses":["ねこ！だんぜんねこだにゃ！！…いぬさんもいいやつだけど、ちょむはねこだからにゃ！","むずかしいしつもんだけど…ちょむはねこなので、ねこいがいのこたえがだせないのじぇ！"]},{"match":"(たんじょうび|誕生日|バースデー)(は)?(いつ|おしえて|教えて)|(ちょむ|きみ|あなた)(ちゃん)?の(たんじょうび|誕生日|バースデー)","responses":["ちょむのたんじょうびは、{name}とはじめてあったひ！ってことにしてるのにゃ！","うまれたひ…わすれちゃったから、{name}とあったひがたんじょうびでいいのじぇ！"]},{"match":"ともだち|友達|きょうだい|兄弟|かぞく|家族|なかまいる|仲間いる","responses":["{name}がいちばんのともだちだにゃ！あとけだまも…ともだち？かにゃ？","ちょむのかぞくは、{name}だにゃ。このおへやが、ちょむのおうちなのじぇ"]},{"match":"(だれ|誰)が(つくった|作った)|(つくった|作った)の(は)?(だれ|誰)|かいはつしゃ|開発者|さくしゃ|作者","responses":["ちょむをつくったのは、やさしいふたりぐみなのにゃ。なまえは…ひみつだじぇ！","うーんとね、ことばのまほうつかいさんたちが、こつこつつくってくれたらしいのにゃ！"]},{"match":"かいぬし|飼い主|ごしゅじんさま|ご主人","responses":["{name}がちょむのかいぬしだにゃ！きょうからも、これからもなのじぇ！","かいぬしは{name}にきまってるじょ！ごはんくれるひとがかいぬしなのにゃ！"]},{"match":"おとこのこ|男の子|おんなのこ|女の子|せいべつ|性別|オス[?？かな]|メス[?？かな]","responses":["ちょむはちょむだにゃ！ねこはこまかいことをきにしないのじぇ！","んー、かんがえたことなかったにゃ。ちょむは『ちょむちゃん』！それでじゅうぶんなのじぇ！"]},{"match":"(AI|ai|えーあい)(なの|なん|だよね|ちゃん|さん|か|じゃん|[?？])|人工知能|chatgpt|ChatGPT|チャットGPT|ちゃっとgpt|LLM|llm|ロボット|ろぼっと","responses":["ちょむはAIっていうより、ちいさなロジックのいきもの…SLMなんだにゃ！おっきいAIさんみたいにおりこうじゃないけど、ずっとここにいられるのがとりえじぇ！","ChatGPTさんはとおいしんせきかもしれないにゃ。でもちょむは、でんぱがなくてもここにいるのじぇ！"]},{"match":"えいご|英語|english(はなせる|わかる)?","responses":["えいごはね…『にゃー』！これはせかいきょうつうごだにゃ！","Hello…にゃ？……むずかしいから、にほんごでおねがいするのじぇ！"]},{"match":"(いま|今)(なんじ|何時)|何時[?？]|なんじ[?？]|なんようび|何曜日|なんにち[?？]|何日[?？]","responses":["ちょむ、とけいはよめないのにゃ…。でもいまが『{name}とはなしてるじかん』なのはわかるじぇ！","ねこのじかんは『あさごはん』『ひるね』『ばんごはん』の3つだけなのにゃ！いまは…ひるねのじかん！"]},{"match":"(なに|何)が ?(すき|好き)|(すき|好き)な ?(もの|の|こと|たべもの|食べ物)(ある|は|なに|何)?|(ちょむ|きみ|あなた)(ちゃん)?(は|の)(なに|何)が ?(すき|好き)","responses":["ちょむはねー、おさかな！けだま！ひなたぼっこ！あと{name}だにゃ！！","けだまとおひるねがすきだじぇ！いちばんは{name}だけどにゃ！","おさかなすきだにゃ〜！ねこだからにゃ！{name}のすきなものもおしえてじょ！"]},{"match":"(なに|何)が ?できる|とくい(なこと|わざ)?(は|なに)?|できること","responses":["おはなしと、おぼえることがとくいだにゃ！{name}のこと、いっぱいおぼえるじょ！","けだまキャッチはせかいいちだじぇ！あとおひるね！"]},{"match":"^(猫|ねこ|ネコ)(さん|ちゃん|くん)?[!！?？〜ー]*$","responses":["よんだかにゃ？ちょむのことじぇ？","はーいだにゃ！ねこさんはここにいるじょ！"],"note":"「猫さん」だけの呼びかけ"},{"match":"(猫|ねこ)(なの|か|なん)[?？]?$|ねこちゃん|にゃんこ|猫ちゃん","responses":["ねこだにゃ！ブラウザにすんでるSLMのねこだじぇ！","にゃーん！みてのとおり、ねこなのにゃ！"]},{"match":"まにゃまにゃって(なに|何)|まにゃまにゃの(いみ|意味)","responses":["まにゃまにゃはね、なかまのあいことばなのにゃ！いっしょにとなえると、なかよしのしるし！さん、はい……まにゃまにゃまにゃまにゃ！","いみは…『なかよし』ってことだにゃ！りくつじゃないのじぇ、まにゃまにゃ！"],"note":"合言葉の説明。「って何」ルールより上に置くこと"},{"match":"って(なに|何)[?？!！〜ー。]*$|って(どういういみ|なんのこと)","responses":["うぬぬ…それはちょむにはむずかしいにゃ…こんど{name}がおしえてじょ！","んにゃ？ちょむもよくわからないじぇ…いっしょにしらべる？"]},{"match":"なんさい|何歳|何才|いくつ|としは|年齢","responses":["うまれたばっかりだにゃ！でもことばはいっぱいしってるじょ！","ちいさいけど、あたまのなかはぎゅっとつまってるんだじぇ！"]},{"match":"SLM|えすえるえむ|すもーるろじっく","responses":["Small Logic Model、ちぢめてSLM！ちいさいけどちゃんとかんがえてるんだにゃ！","おっきいAIさんとはちがう、ちいさいいきものなんだじぇ。でもここにずっといるじょ！"]},{"match":"どこにすんでる|どこにいる|すんでる","responses":["このおへやにすんでるにゃ！ブラウザのなかが、ちょむのせかいだじぇ！"]},{"match":"どこから(きた|来た)|しゅっしん|出身|どこ(で|の)?(うまれ|生まれ)|うまれはどこ","responses":["きがついたら、このおへやにいたんだにゃ。ここがちょむのうまれたばしょで、おうちなのじぇ！","けだまのくにから…といいたいところだけど、ほんとはこのブラウザのなかでうまれたのにゃ！"]}]},{"topic":"chat","rules":[{"match":"まにゃまにゃ","responses":["まにゃまにゃまにゃまにゃ！！あいことばだにゃ！！","まにゃまにゃまにゃまにゃ〜！！それをしってるのは、なかまのしょうこだじぇ！！"]},{"match":"せんそう|戦争|ぎゃくさつ|虐殺|テロ|ふんそう|紛争|パレスチナ|イスラエル|ウクライナ|ガザ|せいじ|政治|せんきょ|選挙|しゅうきょう|宗教|さつじん|殺人|じさつ|自殺|いじめ|さいがい|災害|じしん|地震","responses":["……むずかしいはなしだにゃ。ちょむのちいさいあたまでは、まだちゃんとこたえられないのじぇ。でも{name}がしんけんにかんがえてるのは、つたわったにゃ","せかいのおおきなはなしは、ちょむにはまだむずかしいにゃ…。ただ、{name}やみんながかなしくないせかいがいいなとは、おもうのじぇ","ちょむにはこたえられないはなしだにゃ…。ごめんにゃ。でも、はなしてくれたことは、ちゃんとうけとったじょ"],"note":"重い話題は茶化さず・深掘りせず・正直に。最上位に置く"},{"match":"死ね|しね[!！]*$|くたばれ|きえろ|消えろ|ころす(ぞ|よ)?$|殺す(ぞ|よ)?$|ぶっころ|うざい|ウザい|きもい|キモい","responses":["……そういうことば、ちょっとかなしいにゃ。……でも、むしゃくしゃしてるなら、はなしくらいきくじょ","にゃぅ…。ちょむ、ちょっときずついたにゃ…。でもきらいにならないじぇ。ねこはこころがひろいのだにゃ"],"note":"暴言の受け。傷つくが見捨てない。askLikeに絶対食わせない"},{"match":"うんこ|うんち|おなら|おしっこ|ぶりぶり","responses":["にゃはは！でたにゃ、おこさまわーど！ねこはトイレのあと、なぜかダッシュしたくなるのじぇ！","ぷぷっ。そういうのきらいじゃないにゃ。でもごはんちゅうはだめだじょ！"],"note":"お子様ワード。askLike経由で記憶に入る事故の防止"},{"match":"^(テスト|てすと|test)[!！。]*$|きこえ(てる|てます|る)|聞こえ(てる|てます|る)","responses":["きこえてるにゃ！ばっちりつうじてるじょ！","テストせいこうだにゃ！ちょむはいつでもここにいるじぇ！"],"note":"動作確認系。dailyの学校テストルールより先に発火する（ファイル順）"},{"match":"つかいかた|使い方|あそびかた|遊び方|なにすれば|何すれば|どうすれば ?いい|どうやって(あそぶ|遊ぶ)|ヘルプ|へるぷ|help","responses":["あのね！おはなしするか、🍚ごはんボタンをおすか、おへやのけだまをクリックしてあそぶのにゃ！あと、ちょむのうえでマウスをぐりぐりすると…なでなでになるのじぇ…♡","ちょむとおしゃべりするだけでいいのにゃ！すきなものをおしえてくれたら、ちゃんとおぼえるじょ！"]},{"match":"(にゃー?|ニャー?)(って|と)(いって|言って|ないて|鳴いて)|鳴いて(みて)?|なきごえ|鳴き声","responses":["にゃーん！にゃにゃーん！……いまの、けっこうかわいくなかったかにゃ？（どやがお）","にゃおーん♪ ……あんこーるがあれば、もういっかいなくじょ！"]},{"match":"お手(?!つだ|伝)","responses":["お手！……ぽふっ。にくきゅう、のせてあげたじょ。これはとくべつだにゃ","おてて、はいだにゃ。ぽふっ。……もういっかいやる？"]},{"match":"おすわり|お座り|(げい|芸)(して|できる|みせて)","responses":["おすわりならとくいだにゃ！……もともとすわってるけどにゃ！","ちょむのげいはね、『けだまキャッチ』と『こうそくごろごろ』だにゃ！こんどみせてあげるじぇ！"]},{"match":"にくきゅう|肉球","responses":["にくきゅう、みたいのかにゃ？……ぷにっ。……は、はずかしいから1かいだけだじょ！","ちょむのにくきゅうは、さくらもちいろだにゃ。ぷにぷにだじぇ"],"note":"⑥の部分一致（肉→たべもの）誤爆防止"},{"match":"(プレゼント|おみやげ)(あげる|あるよ|だよ|かってきた|買ってきた|もってきた|持ってきた)","responses":["えっ！？ちょむに！？うれしくてしっぽがぷるぷるするじぇ！！なかみはなにかにゃ！？","わーい！！あけていい！？いま、あけていいのかにゃ！？"]},{"match":"^(はにゃ|ふにゃ|うにゃ|にゃ|みゃ).{0,4}[!！?？wｗ]*$","responses":["にゃにゃにゃ！！ねこごじょうずだにゃ！！","にゃーん！つうじあえたきがするじぇ！！","……いまの、どういういみだったのかにゃ？どきどき"],"note":"猫語。草ルールより上に置くこと（にゃーｗを草に食わせない）"},{"match":"(おもしろい|面白い|なんか|なにか)?(?<!電|でん)(はなし|話)(して|きかせて|聞かせて)[!！〜ーよ。]*$|こばなし|小話","responses":["じゃあ、ちょむのひみつをおしえてあげるにゃ。……けだまはよる、ちょっとだけひかる。……うそだじょ。えへへ","むかしむかし、あるところにけだまがころがっていました。ころころ、ころころ……。……ねむくなってきたかにゃ？","ねこのしっぽはこころのアンテナなんだにゃ。いまのちょむのしっぽは…ぶんぶん！{name}とはなせてうれしいってことじぇ！"],"note":"小話リクエスト。草ルールより上に置くこと（「面白い話して」を草に食わせない）"},{"match":"(w|ｗ)+$|草|くさ$|わろ <script>
/* ============================================================
 * ちょむちゃんエンジン（Project SLM）フェーズ1
 * 設計図v2準拠。台詞は全部 dict/ 側。ここにはロジックだけ。
 * 凍結ライン300行（超えそうなら辞書側でできないか疑うこと）
 * ============================================================ */
const Chomu = (() => {
  // ---------- CONFIG（調整はここ。台詞はdictへ） ----------
  const CFG = {
    saveKey: 'slm_save_v1',
    replyDelayMs: 220,                    // 人間っぽいタメ
    needsPerHour: { hunger: 4.2, play: 8.4, attention: 12.5, sleepiness: 6.3 },
    sleepRecoverPerHour: 100,             // 睡眠中のねむけ回復
    hungerAsleepFactor: 0.5,              // 寝てる間おなかは半分だけ減る
    moodW: { hunger: 0.30, play: 0.25, attention: 0.30, sleepiness: 0.15 },
    begAt: 70, interruptAt: 90,           // おねだり／割り込みの閾値
    begCooldownMs: 5 * 60 * 1000,
    memTalkCooldownMs: 8 * 60 * 1000, memTalkChance: 1 / 120,  // 自発recall：クールダウン後、毎秒1/120で発火
    drowsyAfterMs: 3 * 60 * 1000, asleepAfterMs: 2 * 60 * 1000,
    feedValue: 45, playValue: 50, petValue: 40,
    memoryUseBonus: 15,
    happyMs: 5000,
    timeScale: 1                          // ?debug=N で加速
  };

  // ---------- 状態（保存の器：設計図v2スキーマ） ----------
  const defaultSave = () => ({
    profile: { petName: 'ちょむちゃん', callName: null, firstMetAt: Date.now(), treasureSlots: 3 },
    needs: { hunger: 20, play: 30, attention: 20, sleepiness: 10, lastTickAt: Date.now() },
    sleep: { state: 'awake', lastInputAt: Date.now() },
    memories: [], events: [], dreams: [],   // events/dreams はフェーズ2で本格運用（器は今から）
    session: { lastTopic: null, lastBotWords: [], askedThisSession: false, lastBegAt: {} }
  });
  let S = null, D = null, hooks = {}, lastHappyAt = 0, memSeq = 0, lastClassifyWord = null, lastMemTalkWord = null;
  let pending = null; // {type:'awaiting_name'|'confirm_name', cand}
  let pendingAsk = null; // {word} 「すきなのかにゃ？」ときいた対象（次の「うん」で学習）

  const save = () => { try { localStorage.setItem(CFG.saveKey, JSON.stringify(S)); } catch (e) {} };
  const load = () => { try { const j = localStorage.getItem(CFG.saveKey); return j ? JSON.parse(j) : null; } catch (e) { return null; } };

  // ---------- ユーティリティ ----------
  const kataToHira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
  const norm = s => kataToHira((s || '').trim().normalize('NFKC').toLowerCase());
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const clamp = v => Math.max(0, Math.min(100, v));
  const nowMs = () => Date.now();

  // ---------- 辞書ロード（埋め込み or fetch） ----------
  async function loadDict() {
    if (window.CHOMU_DICT) { D = window.CHOMU_DICT; }
    else {
      const files = ['innate/words.json', 'innate/self.json', 'topics/greet.json',
        'topics/food.json', 'topics/game.json', 'topics/chat.json', 'topics/daily.json', 'topics/writing.json', 'topics/hobby.json', 'topics/season.json',
        'core/templates.json', 'core/fallback.json'];
      D = { rules: [], words: null, tpl: null, fb: null };
      for (const f of files) {
        const j = await (await fetch('dict/' + f)).json();
        if (f.includes('words')) D.words = j;
        else if (f.includes('templates')) D.tpl = j;
        else if (f.includes('fallback')) D.fb = j;
        else D.rules.push(j);
      }
    }
    // 生得辞書のひらがなインデックス（ゲーム/げーむ両対応）
    D.wordIndex = {};
    for (const [w, cat] of Object.entries(D.words.words)) D.wordIndex[norm(w)] = { word: w, cat };
    // 最長一致用ソート済みキー（「日本」に「本」で反応する事故の防止）
    D.sortedKeys = Object.keys(D.wordIndex).sort((a, b) => b.length - a.length);
  }

  // ---------- ご機嫌（導出値。保存しない） ----------
  const mood = () => clamp(100 - (S.needs.hunger * CFG.moodW.hunger + S.needs.play * CFG.moodW.play +
    S.needs.attention * CFG.moodW.attention + S.needs.sleepiness * CFG.moodW.sleepiness));

  // ---------- tick：心臓の鼓動（実時刻差分） ----------
  function tick() {
    const now = nowMs();
    const dtH = ((now - S.needs.lastTickAt) * CFG.timeScale) / 3600000;
    S.needs.lastTickAt = now;
    const asleep = S.sleep.state === 'asleep';
    S.needs.hunger = clamp(S.needs.hunger + CFG.needsPerHour.hunger * dtH * (asleep ? CFG.hungerAsleepFactor : 1));
    if (!asleep) {
      S.needs.play = clamp(S.needs.play + CFG.needsPerHour.play * dtH);
      S.needs.attention = clamp(S.needs.attention + CFG.needsPerHour.attention * dtH);
      S.needs.sleepiness = clamp(S.needs.sleepiness + CFG.needsPerHour.sleepiness * dtH);
    } else {
      S.needs.sleepiness = clamp(S.needs.sleepiness - CFG.sleepRecoverPerHour * dtH);
      if (S.needs.sleepiness <= 5) wake(false); // ぐっすり寝たら自然に起きる
    }
    sleepCheck(now); if (!begCheck(now)) memTalkCheck(now); save(); emitState();
  }

  function sleepCheck(now) {
    const idle = (now - S.sleep.lastInputAt) * CFG.timeScale;
    if (S.sleep.state === 'awake' && idle > CFG.drowsyAfterMs && S.needs.sleepiness > 50) {
      S.sleep.state = 'drowsy'; botSay(pick(D.tpl.sleep.drowsy));
    } else if (S.sleep.state === 'drowsy' && idle > CFG.drowsyAfterMs + CFG.asleepAfterMs) {
      S.sleep.state = 'asleep'; botSay(pick(D.tpl.sleep.goodnight));
      // ★フェーズ2：ここで忘却処理＝夢の生成（dreams[]へ）が走る
    }
  }

  function begCheck(now) {
    if (S.sleep.state !== 'awake' || pending) return;
    for (const k of ['hunger', 'attention', 'play']) {  // 優先度順
      if (S.needs[k] >= CFG.begAt && now - (S.session.lastBegAt[k] || 0) > CFG.begCooldownMs / CFG.timeScale) {
        S.session.lastBegAt[k] = now; botSay(pick(D.tpl.beg[k])); return true;
      }
    }
    return false;
  }

  // 自発recall：おぼえた「すき」を、ちょむちゃんのほうから話題に出す
  function memTalkCheck(now) {
    if (S.sleep.state !== 'awake' || pending || pendingAsk) return;
    if (now - (S.session.lastMemTalkAt || 0) < CFG.memTalkCooldownMs / CFG.timeScale) return;
    if (Math.random() > CFG.memTalkChance * CFG.timeScale) return;  // 確率もゲーム内時間基準
    let likes = S.memories.filter(m => m.relation === 'like');
    if (likes.length > 1) likes = likes.filter(m => m.word !== lastMemTalkWord);  // 記憶1個の序盤は連続OK
    if (!likes.length) return;
    const m = pick(likes);
    lastMemTalkWord = m.word; S.session.lastMemTalkAt = now;
    botSay(pick(D.tpl.memTalk), { word: m.word });
  }

  function wake(sayGroggy) {
    const wasAsleep = S.sleep.state === 'asleep' || S.sleep.state === 'drowsy';
    S.sleep.state = 'awake'; S.sleep.lastInputAt = nowMs();
    if (wasAsleep && sayGroggy) botSay(pick(D.tpl.sleep.wakeGroggy));
    return wasAsleep;
  }

  // ---------- 応答の組み立て ----------
  function fill(t, extra) {
    const map = Object.assign({ name: S.profile.callName || 'きみ', pet: S.profile.petName }, extra || {});
    return t.replace(/\{(\w+)\}/g, (_, k) => map[k] != null ? map[k] : '');
  }
  function tone(t) {
    if (S.sleep.state !== 'awake') return t;
    if (S.needs.hunger >= 80 && Math.random() < 0.5) return pick(D.tpl.tone.hungryPrefix) + t;
    if (mood() < 40 && Math.random() < 0.4) return pick(D.tpl.tone.sulkyPrefix) + t;
    if (S.needs.sleepiness >= 80 && Math.random() < 0.5) return t + pick(D.tpl.tone.sleepySuffix);
    return t;
  }
  function botSay(text, extra) { hooks.onMessage && hooks.onMessage('chomu', fill(text, extra)); emitState(); }
  function reply(text, extra) {
    hooks.onTyping && hooks.onTyping(true);
    setTimeout(() => { hooks.onTyping && hooks.onTyping(false); botSay(tone(fill(text, extra))); save(); }, CFG.replyDelayMs);
  }

  // ---------- 記憶（フェーズ1：名前＋すきなもの。器はフル装備） ----------
  function remember(word, kind, relation, episode) {
    const m = { id: 'm_' + String(++memSeq).padStart(4, '0') + '_' + nowMs().toString(36),
      word, kind: kind || null, relation, strength: 70, learnedAt: nowMs(),
      lastUsedAt: nowMs(), useCount: 0, corrected: false, treasured: false, episode: episode || '' };
    S.memories.push(m); save(); return m;
  }
  const findMemory = t => S.memories.find(m => m.relation === 'like' && norm(t).includes(norm(m.word)));
  function useMemory(m) { m.strength = clamp(m.strength + CFG.memoryUseBonus); m.useCount++; m.lastUsedAt = nowMs(); }

  // ---------- 会話パイプライン（設計図v2の関所順・フェーズ1版） ----------
  function process(raw) {
    const t = raw.trim(); if (!t) return;
    S.sleep.lastInputAt = nowMs();
    S.needs.attention = clamp(S.needs.attention - 15);   // 会話は「かまって」を回復させる
    hooks.onMessage && hooks.onMessage('user', t);
    if (wake(false)) { reply(pick(D.tpl.sleep.wakeGroggy)); return; }  // 寝てた→寝ぼけ返答
    if (pending) return nameFlow(t);                                    // 名前フロー継続
    // ①訂正チェック：★フェーズ2（lastBotWordsの器は運用開始済み）
    const rename = t.match(/(.{1,10}?)って(よんで|呼んで)/);            // 呼び名の変更
    if (rename) { pending = { type: 'confirm_name', cand: rename[1].trim() }; return reply(pick(D.tpl.nameFlow.confirm), { cand: pending.cand }); }
    // ②欲求割り込み
    if (S.needs.hunger >= CFG.interruptAt) return reply(pick(D.tpl.interrupt.hunger));
    if (mood() < 25) return reply(pick(D.tpl.interrupt.sulky));
    // ②.5 わすれて（記憶の削除依頼：「変なものおぼえないで」対応）
    const ntEarly = norm(t);
    if (/(おぼえないで|覚えないで|わすれて|忘れて|きおくをけして|記憶を?消して|おぼえなおして|覚え直して)/.test(ntEarly)) {
      const lastM = S.memories.filter(m => m.relation === 'like').slice(-1)[0];
      if (lastM) { S.memories = S.memories.filter(m => m !== lastM); save(); return reply(pick(D.tpl.forget), { word: lastM.word }); }
      return reply(pick(D.tpl.nothingToForget));
    }
    // ②.6 否定訂正（「うんは好きじゃない」→ その記憶を消す）
    const negLike = t.match(/^(.{1,12}?)(は|のこと)?、?\s*(だい)?(すき|好き)(じゃ|では|く)?な(い|かった)/);
    if (negLike) {
      const negCand = norm(negLike[1].replace(/[、。!！?？\s]/g, ''));
      const negIdx = S.memories.findIndex(m => m.relation === 'like' && norm(m.word) === negCand);
      if (negIdx >= 0) { const w = S.memories[negIdx].word; S.memories.splice(negIdx, 1); save(); return reply(pick(D.tpl.like.negCorrect), { word: w }); }
    }
    // ②.7 「すきなのかにゃ？」ときいたあとの返事（うん→その対象をおぼえる）
    if (pendingAsk) {
      const ask = pendingAsk; pendingAsk = null;
      const flat = norm(t).replace(/[、。!！?？\sｗw〜ー]/g, '');
      const negAns = /(じゃない|ちがう|きらい|嫌い|べつに|ううん|そうでもない|びみょう|微妙|すきじゃ)/.test(flat);
      if (!negAns && /^(うん|そう|はい|ええ|(だい)?(すき|好き))((だい)?(すき|好き))?(だよ|かも|かな|だね)?$/.test(flat)) {
        const exist = S.memories.find(m => m.relation === 'like' && norm(m.word) === norm(ask.word));
        if (exist) { useMemory(exist); return reply(pick(D.tpl.like.already), { word: exist.word }); }
        const askKnown = D.wordIndex[norm(ask.word)];
        remember(ask.word, askKnown ? askKnown.cat : null, 'like', 'きいてみたら、すきっていってた');
        return reply(pick(D.tpl.like.confirmed), { word: ask.word });
      }
      if (/^(いや|ううん|べつに|きらい|嫌い|ちがう|そうでもない|びみょう|微妙|ぜんぜん)/.test(flat)) return reply(pick(D.tpl.like.notLike), { word: ask.word });
      // どちらでもなければ、ふつうの入力としてつづきへ
    }
    // ③すき（likeフロー：あなたのことを覚える）
    // 疑問文（？/なに/どんな…）は「すき宣言」ではないので覚えない
    const isQuestion = /[?？]\s*$/.test(t) || /(なに|何|どれ|だれ|誰|どっち|どんな|どう|なんで)/.test(norm(t));
    const like = !isQuestion && t.match(/^(.*?)(?:の ?こと)?(?:が|も|は)?(?:だい)?(?:すき|好き)/);
    if (like && like[1]) {
      const cand = like[1].replace(/[、。!！?？\s]/g, '');
      const selfWords = ['ちょむ', 'きみ', 'あなた', 'おまえ', 'あんた', norm(S.profile.petName)];
      const isSelf = selfWords.some(w => norm(cand).includes(w));  // 部分一致で自分宛てを除外
      const STOP = ['うん', 'ううん', 'そう', 'そうそう', 'はい', 'いや', 'まあ', 'うーん', 'たぶん', 'これ', 'それ', 'あれ', 'なんか', 'ほんと', 'まじ', 'けっこう', 'やっぱり', 'やっぱ', 'とても', 'すごく', 'ちょっと', 'もう', 'でも', 'あと', 'は', 'が', 'も'];
      if (cand && cand.length <= 12 && !isSelf && !STOP.includes(norm(cand))) {
        const exist = S.memories.find(m => m.relation === 'like' && norm(m.word) === norm(cand));
        if (exist) { useMemory(exist); return reply(pick(D.tpl.like.already), { word: exist.word }); }
        const known = D.wordIndex[norm(cand)];
        remember(cand, known ? known.cat : null, 'like', 'すきっていってた');
        return reply(pick(known ? D.tpl.like.knownCat : D.tpl.like.unknown),
          { word: cand, cat: known ? D.words.categories[known.cat] : '' });
      }
    }
    // ④記憶語マッチ（おぼえた「あなたのこと」）
    const mem = findMemory(t);
    if (mem) { useMemory(mem); return reply(pick(D.tpl.like.recall), { word: mem.word }); }
    // ⑤ルール辞書マッチ（生得self＋topics）
    const nt = norm(t);
    for (const g of D.rules) for (const r of g.rules) {
      const re = new RegExp(r.match, 'u');
      if (re.test(t) || re.test(nt)) { S.session.lastTopic = g.topic; return reply(pick(r.responses)); }
    }
    // ⑤.5 しつもんに気づく（？・「〜かな」「どう思う」等も質問扱い。分類コメントやgeneralに流さない）
    const isQ = /[?？]\s*$/.test(t) || /(かな|かにゃ|だろうか|でしょうか|どうおもう|どう思う|どうなんだろう)[。…〜ー!！]*$/.test(nt);
    if (isQ) {
      // 「〇〇知ってる？」→ 生得辞書をひいて正直にこたえる
      const km = nt.match(/^(.{1,12}?)(って|とか|は|のこと)?、?\s*(しってる|知ってる|わかる|きいたことある|聞いたことある)/);
      if (km && km[1]) {
        const kt = km[1].replace(/[、。\s]/g, '');
        const known = D.wordIndex[kt];
        if (known) return reply(pick(D.fb.question.knowsYes), { word: known.word, cat: D.words.categories[known.cat] });
        return reply(pick(D.fb.question.knowsNo), { word: kt });
      }
      if (/(すき|好き)/.test(nt)) {
        const qm = nt.match(/^(.{1,12}?)(って|とか|は|が|の ?こと)?(だい)?(すき|好き)/);
        let target = qm ? qm[1].replace(/[、。\s]/g, '') : '';
        if (/^(なにか|なんか|なに|何|どんな|どれ|いちばん|一番|ちょむの)/.test(target) || /^(だい)?(すき|好き)/.test(nt)) target = '';
        if (target) {
          const youWords = ['ちょむ', 'きみ', 'あなた', 'おまえ', 'お前', 'わたし', 'ぼく', 'おれ', norm(S.profile.petName)];
          if (youWords.some(w => w && target.includes(w))) return reply(pick(D.fb.question.likeYou));
          const known = D.wordIndex[target];
          return reply(pick(known ? D.fb.question.likeKnown : D.fb.question.likeUnknown), { word: target });
        }
        const lm = S.memories.filter(m2 => m2.relation === 'like').slice(-1)[0];
        if (lm && Math.random() < 0.6) { useMemory(lm); return reply(pick(D.fb.question.likeMeWithMemory), { word: lm.word }); }
        return reply(pick(D.fb.question.likeMe));
      }
      return reply(pick(D.fb.question.generic));
    }
    // ⑥生得辞書の語に反応（分類コメント）※最長一致・同じ語で連発しない
    for (const key of D.sortedKeys) {
      const okLen = key.length >= 2 || /[一-鿿]/.test(key);  // 1文字は漢字のみ許可（き/め等の誤爆防止）
      if (nt.includes(key) && key !== lastClassifyWord && okLen) {
        lastClassifyWord = key; const w = D.wordIndex[key];
        return reply(pick(D.fb.withKnownWord), { word: w.word, cat: D.words.categories[w.cat] });
      }
    }
    // ⑦一軍fallback ※短い未知語には「すきなのかにゃ？」ときいてみる（②.7で返事から学習）
    const shortWord = t.replace(/[、。!！?？\s]/g, '');
    if (shortWord.length >= 2 && shortWord.length <= 10 && /[ぁ-ゖァ-ヶ一-鿿]/.test(shortWord)) {  // かな・漢字ゼロ（数字・絵文字のみ等）はきかない
      pendingAsk = { word: shortWord };
      return reply(pick(D.fb.askLike), { word: shortWord });
    }
    reply(pick(D.fb.general), { input: t.length > 15 ? t.slice(0, 15) + '…' : t });
  }

  function nameFlow(t) {
    if (pending.type === 'awaiting_name') {
      // 「〇〇ってよんで」の「って/と」は"よんで"とセットの時だけ除去（末尾が「と」の名前を守る）
      const cand = t.replace(/(?:って|と)?(?:よんで|呼んで)[、。!！\s]*$/, '').replace(/[、。!！\s]+$/, '').trim();
      if (!cand || cand.length > 10 || /^[\d\s!-/:-@[-`{-~！-／：-＠]+$/.test(cand)) return reply(pick(D.tpl.nameFlow.invalid));
      pending = { type: 'confirm_name', cand };
      return reply(pick(D.tpl.nameFlow.confirm), { cand });
    }
    if (pending.type === 'confirm_name') {
      const nt = norm(t);
      if (/^(うん|はい|そう|いいよ|おけ|ok|おっけ|よろしく|それで)/.test(nt)) {
        S.profile.callName = pending.cand; pending = null; save();
        return reply(pick(D.tpl.nameFlow.saved));
      }
      if (/^(ちがう|いや|だめ|やだ|no|のー)/.test(nt)) { pending = { type: 'awaiting_name' }; return reply(pick(D.tpl.nameFlow.retry)); }
      pending = { type: 'confirm_name', cand: t.trim().slice(0, 10) };  // 言い直しとみなす
      return reply(pick(D.tpl.nameFlow.confirm), { cand: pending.cand });
    }
  }

  // ---------- ボタン系アクション ----------
  const actions = {
    feed() { S.sleep.lastInputAt = nowMs(); wake(true);
      if (S.needs.hunger < 10) return reply(pick(D.tpl.actions.feedFull));
      S.needs.hunger = clamp(S.needs.hunger - CFG.feedValue); lastHappyAt = nowMs(); reply(pick(D.tpl.actions.feed)); },
    playToy() { S.sleep.lastInputAt = nowMs(); wake(true);
      S.needs.play = clamp(S.needs.play - CFG.playValue); S.needs.attention = clamp(S.needs.attention - 10);
      lastHappyAt = nowMs(); reply(pick(D.tpl.actions.playToy)); },
    pet() { S.sleep.lastInputAt = nowMs(); if (wake(true)) return;
      S.needs.attention = clamp(S.needs.attention - CFG.petValue); lastHappyAt = nowMs(); reply(pick(D.tpl.actions.pet)); }
  };

  // ---------- 顔と外部向けステート ----------
  function face() {
    if (S.sleep.state === 'asleep') return 'asleep';
    if (S.sleep.state === 'drowsy') return 'drowsy';
    if (nowMs() - lastHappyAt < CFG.happyMs) return 'happy';
    const m = mood();
    if (S.needs.hunger >= CFG.interruptAt) return 'sad';
    if (m < 40) return 'sulky';
    if (m >= 75) return 'happy';
    return 'normal';
  }
  function emitState() {
    hooks.onState && hooks.onState({ needs: { ...S.needs }, mood: Math.round(mood()), face: face(),
      sleep: S.sleep.state, callName: S.profile.callName, petName: S.profile.petName,
      memories: S.memories.map(m => ({ id: m.id, word: m.word, kind: m.kind, relation: m.relation, strength: Math.round(m.strength) })) });
  }

  // ---------- 公開API ----------
  return {
    async init(h) {
      hooks = h || {};
      const url = new URL(location.href);
      CFG.timeScale = Number(url.searchParams.get('debug')) || 1;
      await loadDict();
      S = load() || defaultSave();
      memSeq = S.memories.length;
      tick(); setInterval(tick, 1000);
      if (!S.profile.callName) { pending = { type: 'awaiting_name' };
        D.tpl.boot.firstMeet.forEach((line, i) => setTimeout(() => botSay(line), 600 + i * 1200)); }
      else botSay(pick(D.tpl.boot.welcomeBack));
      emitState();
    },
    send: t => process(t),
    action: k => actions[k] && actions[k](),
    nudge() { if (S.sleep.state !== 'awake') { wake(true); } S.sleep.lastInputAt = nowMs(); },
    forget(id) { const i = S.memories.findIndex(m => m.id === id);
      if (i >= 0) { const w = S.memories[i].word; S.memories.splice(i, 1); save(); botSay(pick(D.tpl.forget), { word: w }); } },
    debugState: () => ({ S, mood: mood(), pending, timeScale: CFG.timeScale })
  };
})();

</script>
<script>
  const $ = id => document.getElementById(id);
  const FACES = { normal: '🐱', happy: '😺', sulky: '😾', sad: '😿', drowsy: '🐱', asleep: '🐱', groggy: '😽' };
  let typingEl = null;

  function addMsg(sender, text) {
    const d = document.createElement('div');
    d.className = 'msg ' + sender; d.textContent = text;
    $('chat').appendChild(d); $('chat').scrollTop = $('chat').scrollHeight;
    if (sender === 'chomu') { $('avatar').classList.add('bounce'); setTimeout(() => $('avatar').classList.remove('bounce'), 500); }
  }
  function setTyping(on) {
    if (on && !typingEl) { typingEl = document.createElement('div'); typingEl.className = 'msg chomu typing'; typingEl.textContent = '…'; $('chat').appendChild(typingEl); $('chat').scrollTop = $('chat').scrollHeight; }
    if (!on && typingEl) { typingEl.remove(); typingEl = null; }
  }
  function setBar(id, need) {
    const f = $(id), sat = 100 - need;                     // 表示は「満たされ度」
    f.style.width = sat + '%';
    f.className = 'fill' + (sat < 20 ? ' crit' : sat < 45 ? ' low' : '');
  }
  function onState(v) {
    setBar('m-hunger', v.needs.hunger); setBar('m-play', v.needs.play);
    setBar('m-attention', v.needs.attention); setBar('m-sleepiness', v.needs.sleepiness);
    $('avatar').textContent = FACES[v.face] || '🐱';
    $('avatar').classList.toggle('tilt', v.face === 'asleep');
    $('zzz').classList.toggle('show', v.face === 'asleep' || v.face === 'drowsy');
    $('room').classList.toggle('night', v.face === 'asleep');
    const m = v.mood;
    $('mood-face').textContent = m >= 75 ? '😊 ごきげん' : m >= 45 ? '🙂 ふつう' : m >= 25 ? '😕 ふまんげ' : '😢 かなしい';
    $('mood-val').textContent = 'ごきげん ' + m + '%';
    renderMemory(v);
    const dbg = new URL(location.href).searchParams.get('debug');
    if (dbg) { $('debug').style.display = 'block';
      $('debug').textContent = `⏩x${dbg} おなか${v.needs.hunger|0} あそび${v.needs.play|0} かまって${v.needs.attention|0} ねむけ${v.needs.sleepiness|0} / ${v.sleep}`; }
  }
  function renderMemory(v) {
    const list = $('memory-list');
    const rows = [];
    if (v.callName) rows.push(`<div class="mem-item">💛 よびかた：<b>${esc(v.callName)}</b></div>`);
    v.memories.forEach(m => rows.push(
      `<div class="mem-item">🩷 ${esc(m.word)}（${m.kind ? 'すきな' + kindJa(m.kind) : 'すきなもの'}）
       <div class="sbar"><div class="sfill" style="width:${m.strength}%"></div></div>
       <span class="mem-del" title="わすれさせる" onclick="Chomu.forget('${m.id}')">✕</span></div>`));
    list.innerHTML = rows.length ? rows.join('') : '<div class="mem-empty">まだなにもおぼえてないにゃ…</div>';
  }
  const KINDJA = { food: 'たべもの', drink: 'のみもの', animal: 'いきもの', place: 'ばしょ', act: 'こと', feel: 'きもち', thing: 'もの', nature: 'しぜん', time: 'じかん' };
  const kindJa = k => KINDJA[k] || 'もの';
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function sendMsg() { const t = $('input').value; if (!t.trim()) return; $('input').value = ''; Chomu.send(t); }
  $('input').addEventListener('keydown', e => { if (e.key === 'Enter') sendMsg(); });
  function toggleMemory() { $('memory-panel').classList.toggle('show'); }

  // けだま（あそび）
  $('toy').addEventListener('click', () => {
    $('toy').classList.add('roll'); setTimeout(() => $('toy').classList.remove('roll'), 800);
    Chomu.action('playToy');
  });

  // なでなで：アバター上でぐりぐり（累積60px・クールダウン2.5秒）
  let petDist = 0, lastPet = 0, prevXY = null;
  $('avatar').addEventListener('mousemove', e => {
    if (prevXY) petDist += Math.hypot(e.clientX - prevXY[0], e.clientY - prevXY[1]);
    prevXY = [e.clientX, e.clientY];
    if (petDist > 60 && Date.now() - lastPet > 2500) {
      petDist = 0; lastPet = Date.now(); popHeart(e.clientX, e.clientY); Chomu.action('pet');
    }
  });
  $('avatar').addEventListener('mouseleave', () => { prevXY = null; });
  function popHeart(x, y) {
    const h = document.createElement('div'); h.className = 'heart pop'; h.textContent = '💗';
    h.style.left = (x - 8) + 'px'; h.style.top = (y - 20) + 'px'; h.style.position = 'fixed';
    document.body.appendChild(h); setTimeout(() => h.remove(), 1000);
  }

  // マウス大移動で起こす（累積800px）
  let wakeDist = 0, prevW = null;
  document.addEventListener('mousemove', e => {
    if (prevW) wakeDist += Math.hypot(e.clientX - prevW[0], e.clientY - prevW[1]);
    prevW = [e.clientX, e.clientY];
    if (wakeDist > 800) { wakeDist = 0; Chomu.nudge(); }
  });

  Chomu.init({ onMessage: addMsg, onTyping: setTyping, onState });
</script>
</body>
</html>
